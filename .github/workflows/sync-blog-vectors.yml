name: Sync blog vectors

on:
  push:
    branches: [main]
    paths:
      - "src/data/blog/**"
      - "scripts/sync_blog_vectors.py"
      - ".github/workflows/sync-blog-vectors.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1001876988238/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-blog-sync@tough-cipher-472109-v5.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install google-cloud-bigquery==3.45.0

      - name: Sync articles and vectorize new ones
        run: python scripts/sync_blog_vectors.py
